server:
  port: 8085

spring:
  application:
    name: tarotalk-feed-service
  datasource:
    url: jdbc:h2:mem:feeddb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR

integrations:
  user-service:
    base-url: http://localhost:8082
  notification-service:
    base-url: http://localhost:8087
  event-service:
    base-url: http://localhost:8091
  relationship-service:
    base-url: http://localhost:8088
  world-service:
    base-url: http://localhost:8092

feed:
  visibility:
    strategy: hybrid
  fanout:
    strategy: hybrid
    max-recipients: 60
  ranking:
    weights:
      freshness: 0.35
      interaction-velocity: 0.25
      relationship-affinity: 0.20
      narrative-relevance: 0.20
  event:
    ttl-hours: 72
    max-count: 200

http:
  client:
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    max-attempts: 3
    retry-backoff-ms: 150

management:
  endpoints:
    web:
      exposure:
        include: health,info


logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%property{spring.application.name}] [%X{traceId}] [%X{userId}] %logger{36} - %msg%n"
