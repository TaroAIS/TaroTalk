server:
  port: 8090

spring:
  application:
    name: tarotalk-ai-service

ai:
  provider:
    base-url: ${LLM_API_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}

management:
  endpoints:
    web:
      exposure:
        include: health,info


logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%property{spring.application.name}] [%X{traceId}] [%X{userId}] %logger{36} - %msg%n"
