apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: tarotalk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: tarotalk/orchestrator:latest
          ports:
            - containerPort: 8077
          env:
            - name: ORCH_PORT
              value: "8077"
            - name: USER_SERVICE_URL
              value: http://user-service:8082
            - name: CONTACT_SERVICE_URL
              value: http://user-service:8082
            - name: RELATIONSHIP_SERVICE_URL
              value: http://relationship-service:8088
            - name: CHAT_SERVICE_URL
              value: http://chat-service:8084
            - name: FEED_SERVICE_URL
              value: http://feed-service:8085
---
