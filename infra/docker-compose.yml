version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: tarotalk
      POSTGRES_PASSWORD: tarotalk
      POSTGRES_DB: tarotalk
    ports:
      - "5432:5432"
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: "neo4j/password"
    ports:
      - "7687:7687"
      - "7474:7474"
  zookeeper:
    image: bitnami/zookeeper:3.9
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
  kafka:
    image: bitnami/kafka:3.7
    depends_on:
      - zookeeper
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
  temporal:
    image: temporalio/auto-setup:1.25.1
    depends_on:
      - postgres
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: tarotalk
      POSTGRES_PWD: tarotalk
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
  temporal-ui:
    image: temporalio/ui:2.30.3
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"
  orchestrator:
    build: ../orchestrator
    environment:
      ORCH_PORT: 8077
      USER_SERVICE_URL: http://user-service:8082
      CONTACT_SERVICE_URL: http://user-service:8082
      RELATIONSHIP_SERVICE_URL: http://relationship-service:8088
      PERSONA_SERVICE_URL: http://persona-service:8083
      CHAT_SERVICE_URL: http://chat-service:8084
      FEED_SERVICE_URL: http://feed-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
    ports:
      - "8077:8077"
