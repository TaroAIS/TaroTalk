apiVersion: v1
kind: Namespace
metadata:
  name: tarotalk
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: tarotalk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: tarotalk/gateway:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: tarotalk
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: tarotalk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: tarotalk/auth-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: INTEGRATIONS_USER_SERVICE_BASE_URL
              value: http://user-service:8082
            - name: SECURITY_JWT_SECRET
              value: change-me
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: tarotalk
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
---
