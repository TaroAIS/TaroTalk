version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: tarotalk
      POSTGRES_PASSWORD: tarotalk
      POSTGRES_DB: tarotalk
    ports:
      - "5432:5432"
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: "neo4j/password"
    ports:
      - "7687:7687"
      - "7474:7474"
  orchestrator:
    build: ../orchestrator
    environment:
      ORCH_PORT: 8077
      USER_SERVICE_URL: http://user-service:8082
      CONTACT_SERVICE_URL: http://user-service:8082
      RELATIONSHIP_SERVICE_URL: http://relationship-service:8088
      PERSONA_SERVICE_URL: http://persona-service:8083
      CHAT_SERVICE_URL: http://chat-service:8084
      FEED_SERVICE_URL: http://feed-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8087
    ports:
      - "8077:8077"
