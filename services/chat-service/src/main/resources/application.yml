server:
  port: 8084

spring:
  application:
    name: tarotalk-chat-service
  datasource:
    url: jdbc:h2:mem:chatdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_uuid_jdbc_type: CHAR
  data:
    mongodb:
      uri: mongodb://localhost:27017/tarotalk_chat
  redis:
    host: localhost
    port: 6379

integrations:
  ai-service:
    base-url: http://localhost:8090
  orchestrator:
    base-url: http://localhost:8077

management:
  endpoints:
    web:
      exposure:
        include: health,info


logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%property{spring.application.name}] [%X{traceId}] [%X{userId}] %logger{36} - %msg%n"
