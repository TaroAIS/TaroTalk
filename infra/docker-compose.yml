version: "3.9"
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: tarotalk
      POSTGRES_PASSWORD: tarotalk
      POSTGRES_DB: tarotalk
    ports:
      - "5432:5432"
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: "neo4j/password"
    ports:
      - "7687:7687"
      - "7474:7474"
