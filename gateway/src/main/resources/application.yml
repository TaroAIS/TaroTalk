server:
  port: 8080

spring:
  application:
    name: tarotalk-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/users/**,/api/contacts/**
        - id: persona-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/personas/**
        - id: chat-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/conversations/**,/api/messages/**,/api/media/**,/ws/**,/api/v2/conversations/**
        - id: feed-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/feeds/**,/api/v2/feeds/**
        - id: presence-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/presence/**
        - id: notification-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/notifications/**
        - id: relationship-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/relationships/**
        - id: scheduler-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/scheduler/**
        - id: ai-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/ai/**
        - id: orchestrator
          uri: http://localhost:8077
          predicates:
            - Path=/api/a2a/**,/api/v2/a2a/**
        - id: event-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/v2/events/**,/api/v2/traces/**
        - id: world-service
          uri: http://localhost:8092
          predicates:
            - Path=/api/v2/worlds/**

security:
  jwt:
    secret: "dev-secret-change-me-dev-secret-change-me"
    enforce: false

management:
  endpoints:
    web:
      exposure:
        include: health,info


logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%property{spring.application.name}] [%X{traceId}] [%X{userId}] %logger{36} - %msg%n"
