server:
  port: 8085

spring:
  application:
    name: tarotalk-feed-service
  datasource:
    url: jdbc:h2:mem:feeddb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

integrations:
  user-service:
    base-url: http://localhost:8082
  notification-service:
    base-url: http://localhost:8087
  relationship-service:
    base-url: http://localhost:8088

feed:
  visibility:
    strategy: contact

management:
  endpoints:
    web:
      exposure:
        include: health,info


logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%property{spring.application.name}] [%X{traceId}] [%X{userId}] %logger{36} - %msg%n"
